[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "f1-predictor"
version = "1.0.0"
description = "Fail-closed Formula 1 prediction and archival collection domain"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "httpx>=0.28.1,<1", "numpy>=2.3,<3", "pandas>=2.3,<4",
  "packaging>=25,<27", "predictor-core>=2.3,<3", "predictor-ops>=3.1,<4",
  "pydantic>=2.11,<3", "pydantic-settings>=2.10,<3", "pyyaml>=6.0.2,<7", "scipy>=1.16,<2",
]

[project.scripts]
f1-predictor = "src.cli:main"
f1-predict = "src.predict:main"
f1-operate = "src.operate:main"
f1-archival-collection = "src.archival_collection:main"
f1-forward-snapshot = "scripts.capture_next_forward_snapshot:main"
f1-market-import = "src.market_collection.cli:import_main"
f1-market-quality = "src.market_collection.cli:quality_main"

[project.optional-dependencies]
dev = ["build>=1.3,<2", "coverage[toml]>=7.10,<8", "pre-commit>=4.3,<5", "pyright>=1.1.403,<2", "pytest>=8.4,<10", "pytest-cov>=6.2,<8", "ruff>=0.12.7,<1"]

[tool.uv.sources]
predictor-core = { url = "https://github.com/leonardosovienski/core-predictor/releases/download/v2.3.0/predictor_core-2.3.0-py3-none-any.whl" }
predictor-ops = { url = "https://github.com/leonardosovienski/predictor-ops/releases/download/v3.1.0/predictor_ops-3.1.0-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]
artifacts = ["config.yaml", "data/*.json"]

[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "src/config.yaml"
"data/drivers_f1.json" = "src/data/drivers_f1.json"
"data/circuits_f1.json" = "src/data/circuits_f1.json"
"data/authorized_closure.json" = "src/data/authorized_closure.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 110
include = ["src/clock.py", "src/config.py", "src/contracts.py", "src/services.py", "src/cli.py", "src/data/f1_provider.py", "src/market_collection/*.py", "tests/test_market_collection.py", "tests/test_modernization_contracts.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src/clock.py", "src/config.py", "src/contracts.py", "src/services.py", "src/cli.py", "src/market_collection", "tests/test_market_collection.py"]
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
