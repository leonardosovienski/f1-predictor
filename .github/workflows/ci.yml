name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.8.15" }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install released shared wheels
        run: uv sync --frozen --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest -W error::ResourceWarning --cov=src --cov-branch --cov-report=term-missing --cov-report=json
      - run: uv run python scripts/coverage_scopes.py
      - run: uv build
      - name: Wheel smoke outside checkout
        run: |
          venv=$(mktemp -d)
          python -m venv "$venv"
          "$venv/bin/pip" install dist/*.whl
          cd /tmp
          "$venv/bin/f1-predictor" --help
      - run: docker build -t f1-predictor:test .
      - run: docker run --rm --read-only f1-predictor:test health --offline
