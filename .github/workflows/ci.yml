name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Projeto Atual)
        uses: actions/checkout@v4

      - name: Clonar Tools Predictor (Dependência)
        uses: actions/checkout@v4
        with:
          repository: leonardosovienski/tools-predictor
          path: tools

      - name: Clonar Core Predictor (Dependência)
        uses: actions/checkout@v4
        with:
          repository: leonardosovienski/core-predictor
          path: core

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Cache removido propositalmente para evitar erro de arquivo inexistente

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest 
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Simular Workspace Local (sys.path)
        run: |
          if [ -f pyproject.toml ]; then
            PACKAGE_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb')).get('project', {}).get('name', ''))")
            if [ -n "$PACKAGE_NAME" ]; then
              ln -sfn $(pwd) ../$PACKAGE_NAME
            fi
          fi

      - name: Executar Testes
        # ==============================================================================================
        # O runner do GitHub Actions é limpo e não tem os artefatos operacionais de data/
        # (f1.db, ratings.json — gitignored). Isso era resolvido com "|| true", que forçava
        # sucesso e apagava JUNTO qualquer regressão real do resto da suíte. Agora os testes
        # que dependem desses artefatos têm skipif explícito (tests/test_snapshots.py), então
        # a esteira roda honesta: falha de teste reprova o pipeline.
        # ==============================================================================================
        run: |
          PYTHONPATH=.:vendor:core:tools python -m pytest -v \
            --ignore=tests/test_weekly_download.py
