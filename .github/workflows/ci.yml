name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.8.15" }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install released shared wheels
        run: uv sync --frozen --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest -W error::ResourceWarning --cov=src --cov-branch --cov-report=term-missing --cov-report=json
      - run: uv run python scripts/coverage_scopes.py
      - run: uv build
      - name: Wheel smoke outside checkout
        run: |
          venv=$(mktemp -d)
          python -m venv "$venv"
          "$venv/bin/pip" install dist/*.whl \
            "predictor-core @ https://github.com/leonardosovienski/core-predictor/releases/download/v2.1.0/predictor_core-2.1.0-py3-none-any.whl" \
            "predictor-ops @ https://github.com/leonardosovienski/tools-predictor/releases/download/v2.0.1/predictor_ops-2.0.1-py3-none-any.whl"
          cd /tmp
          "$venv/bin/f1-predictor" --help

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t f1-predictor:test .
      - run: docker run --rm --read-only f1-predictor:test health --offline
      - uses: anchore/sbom-action@v0
        with:
          image: f1-predictor:test
          artifact-name: f1-predictor.spdx.json
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: f1-predictor:test
          severity: CRITICAL,HIGH
          exit-code: "1"
