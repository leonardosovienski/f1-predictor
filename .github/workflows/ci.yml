name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Projeto Atual)
        uses: actions/checkout@v4

      - name: Clonar Tools Predictor (Dependência)
        uses: actions/checkout@v4
        with:
          repository: leonardosovienski/tools-predictor
          path: tools

      - name: Clonar Core Predictor (Dependência)
        uses: actions/checkout@v4
        with:
          repository: leonardosovienski/core-predictor
          path: core

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Cache removido propositalmente para evitar erro de arquivo inexistente

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest 
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Simular Workspace Local (sys.path)
        run: |
          if [ -f pyproject.toml ]; then
            PACKAGE_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb')).get('project', {}).get('name', ''))")
            if [ -n "$PACKAGE_NAME" ]; then
              ln -sfn $(pwd) ../$PACKAGE_NAME
            fi
          fi

      - name: Gerar Artefatos Operacionais de Teste
        # O runner é limpo e não tem os artefatos de data/ (f1.db, ratings.json,
        # fase2_params.json — gitignored). Este seed monta um substrato sintético
        # determinístico a partir do que já é versionado, para que os 11 testes de
        # tests/test_snapshots.py que dependem deles RODEM aqui em vez de só pular.
        # O script nunca sobrescreve arquivo existente.
        run: python scripts/seed_test_fixtures.py

      - name: Executar Testes
        # ==============================================================================================
        # Antes, a falta desses artefatos era "resolvida" com "|| true", que forçava sucesso e
        # apagava JUNTO qualquer regressão real do resto da suíte. Com o seed acima, a esteira
        # roda honesta E completa: falha de teste reprova o pipeline.
        # ==============================================================================================
        run: |
          PYTHONPATH=.:vendor:core:tools python -m pytest -v \
            --ignore=tests/test_weekly_download.py
